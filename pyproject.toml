[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rto"
version = "0.1.0"
description = "Real-Time Operations coin transaction processor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
rto = "rto.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rto*"]
