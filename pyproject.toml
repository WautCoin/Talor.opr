[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchcoin"
version = "0.1.0"
description = "Batch coin transaction processor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
batchcoin = "batchcoin.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["batchcoin*"]
